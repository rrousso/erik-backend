# Spring Boot Configuration
spring:
  application:
    name: erik-core
  
  # Disable unnecessary Spring Boot features for console app
  main:
    web-application-type: none
    banner-mode: off
  
  # JPA configuration (if you plan to use database later)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  
  h2:
    console:
      enabled: false

# Erik-specific configuration
erik:
  # Narrative Model Configuration (Claude Sonnet - for Erik & Narrator)
  narrative:
    model: anthropic/claude-3.5-sonnet
    temperature: 0.9
    max-tokens: 1500
  
  # Analytical Model Configuration (Gemini Flash - for flags, extraction, quick synopsis)
  analytical:
    model: google/gemini-2.5-flash
    temperature: 0.3
    max-tokens: 500
  
  # Shared API Configuration
  api-key: ${OPENROUTER_API_KEY:}
  
  # Context Window Configuration
  round-window-size: 8
  round-threshold-size: 10
  
  # User Data Configuration
  user-data-dir: user_data
  user-persona-file: user_data/persona.txt

# Logging configuration
logging:
  level:
    root: WARN
    com.github.rrousso.erik_core: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"