# Erik Application Configuration - Properties Format
# This file should be placed in src/main/resources/

# Spring Boot Configuration
spring.application.name=erik-core
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Erik - Narrative Model Configuration (Claude Sonnet)
erik.narrative.model=anthropic/claude-sonnet-4.5
erik.narrative.temperature=0.9
erik.narrative.max-tokens=3000

# Erik - Analytical Model Configuration (Gemini Flash)
erik.analytical.model=google/gemini-2.5-flash-lite
erik.analytical.temperature=0.3
erik.analytical.max-tokens=1000

# Erik - Shared API Configuration
erik.api-key=${OPENROUTER_API_KEY:}

# Erik - Context Window Configuration
erik.round-window-size=2
erik.round-threshold-size=4

# Erik - User Data Configuration
erik.user-data-dir=user_data
erik.user-persona-file=user_data/persona.txt

# Logging Configuration
logging.level.root=WARN
logging.level.com.github.rrousso.erik_core=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/erik_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Force immediate database writes (no caching)
spring.jpa.properties.hibernate.connection.autocommit=true

# Disable second-level cache
spring.jpa.properties.hibernate.cache.use_second_level_cache=false